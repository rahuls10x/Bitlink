name: Bitlink 
services:
  backend-server:
    build:
      context: ./backend-server
      dockerfile: Dockerfile
    ports:
      - "4001:4001"
    environment:
      - PORT=4001
      - ORIGIN_URL=http://localhost:5174
      - AUTH_SERVER_URL=http://localhost:4000
      - CLIENT_ID=client_*************************
      - CLIENT_SECRET=secret_************************
      - REDIRECT_URI=http://localhost:5174/callback
      - MONGO_DB=mongodb://mongo:27017/
      - REDIS_DB=redis://redis:6379
    restart: unless-stopped
    depends_on:
      - mongo
      - redis

  frontend-server:
    build:
      context: ./frontend-server
      dockerfile: Dockerfile
    ports:
      - "5174:5174"
    environment:
      - VITE_CLIENT_ID=client_*************************
      - VITE_REDIRECT_URI=http://localhost:5174/callback
      - VITE_AUTH_URL=http://localhost:4000/authorize
      - VITE_API_URL=http://localhost:4001
    restart: unless-stopped
    depends_on:
      - backend-server
  mongo:
    image: mongo:8
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:8
    ports:
      - "6380:6379"

  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: rootpass
    volumes:
      - minio-data:/data
    restart: unless-stopped
volumes:
  mongo-data:
  minio-data: